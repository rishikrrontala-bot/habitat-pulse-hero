<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1c3128"/>
      <stop offset="55%" stop-color="#16261f"/>
      <stop offset="100%" stop-color="#0e1b17"/>
    </radialGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#9df5cf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#9fc7b6" stroke-opacity="0.16" stroke-width="2"/>

  <!-- ambient far-back pulse echoes, matching the app's layered-signal motif -->
  <path d="M 60 344 L 140 344 L 172 320 L 204 344 L 452 344"
        fill="none" stroke="#6ee7b7" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 60 362 L 120 362 L 148 380 L 176 362 L 452 362"
        fill="none" stroke="#6ee7b7" stroke-opacity="0.12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signature pulse line, rising to meet a map pin planted on it -->
  <g filter="url(#glow)">
    <path d="M 56 306
             L 146 306
             L 172 262
             L 198 306
             L 250 306"
          fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 306
             L 274 306
             L 306 306
             L 334 346
             L 362 306
             L 456 306"
          fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- map pin: rounded top, tapering to a point that touches the line -->
    <path d="M 204 214
             A 46 46 0 1 1 296 214
             C 296 254, 268 278, 250 306
             C 232 278, 204 254, 204 214
             Z"
          fill="#0e1b17" stroke="url(#pulseGrad)" stroke-width="11" stroke-linejoin="round"/>
    <circle cx="250" cy="212" r="15" fill="#0e1b17" stroke="url(#pulseGrad)" stroke-width="9"/>
  </g>
</svg>
